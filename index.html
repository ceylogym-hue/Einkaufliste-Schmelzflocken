<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Einkaufsliste – Schmelzflocken Banana Bread Chocolate Style</title>
<link href="https://fonts.googleapis.com/css2?family=Italianno&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--cream:#F7F1E5;--cream-2:#FFFCF5;--bd:#2B1D13;--br:#4A3420;--tan:#C6A46B;--acc:#8A5A34;--line:rgba(43,29,19,.18)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--bd);font-family:'Fraunces',Georgia,serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:0 22px 60px}
.hero{padding:48px 0 10px;text-align:center}
.seal{width:88px;height:88px;margin:0 auto 20px;border-radius:50%;border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;position:relative}
.seal:before{content:"";position:absolute;inset:6px;border-radius:50%;border:1px solid var(--tan)}
.seal span{font-family:'Italianno',cursive;font-size:38px;transform:translateY(2px)}
.eyebrow,.sub2,.cap,.th{font-family:'Courier Prime',monospace;text-transform:uppercase;color:var(--acc)}
.eyebrow{letter-spacing:4px;font-size:11px;margin-bottom:8px}
h1{font-family:'Italianno',cursive;font-weight:400;font-size:76px;line-height:.95;margin:0 0 6px}
.sub{font-style:italic;font-size:16px;color:var(--br);margin-bottom:8px}
.sub2{font-size:10.5px;letter-spacing:3px}
.divider{display:flex;align-items:center;gap:14px;margin:30px 0}
.divider i{flex:1;height:1px;background:var(--tan)}
.divider b{width:6px;height:6px;background:var(--tan);transform:rotate(45deg)}
.photo{background:var(--cream-2);border:1px solid var(--line);padding:10px;box-shadow:0 10px 24px -18px rgba(43,29,19,.55)}
.photo img{display:block;width:100%;height:auto;max-height:520px;object-fit:cover}
.cap{font-size:10px;letter-spacing:3px;text-align:center;margin:12px 0 0}
.list{margin-top:34px;background:var(--cream-2);border:1px solid var(--line);box-shadow:0 1px 0 #DCC79E}
.head,.row{display:grid;grid-template-columns:28px 1fr 74px 84px;align-items:center;gap:8px;padding:0 14px}
.head{background:var(--bd);color:var(--cream-2);height:34px}
.th{color:var(--cream-2);font-size:9px;letter-spacing:1.5px}
.th.r{text-align:center}
.row{min-height:62px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row input{position:absolute;opacity:0}
.box{width:16px;height:16px;border:1.5px solid var(--acc);display:block;position:relative}
.row input:checked+.box{background:var(--acc)}
.row input:checked+.box:after{content:"";position:absolute;left:4px;top:0;width:4px;height:9px;border:solid var(--cream-2);border-width:0 2px 2px 0;transform:rotate(45deg)}
.name{font-size:17px;font-weight:500;line-height:1.2}
.name em{display:block;font-size:13px;font-weight:400;color:var(--acc);margin-top:2px}
.row input:checked~.name{text-decoration:line-through;opacity:.45}
.p1,.p3{font-family:'Courier Prime',monospace;text-align:center;font-size:13px}
.p1{color:var(--br)} .p3{font-weight:700}
.note{text-align:center;font-style:italic;font-size:13px;color:var(--br);margin-top:18px}
.foot{text-align:center;margin-top:44px;font-family:'Courier Prime',monospace;font-size:10px;letter-spacing:3px;color:var(--acc)}
@media(max-width:440px){.head,.row{grid-template-columns:24px 1fr 56px 68px;padding:0 10px}.name{font-size:15px}h1{font-size:62px}}
@media print{.row{break-inside:avoid}}
</style></head><body><div class="wrap">
